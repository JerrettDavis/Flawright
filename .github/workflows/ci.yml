name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore Flawright.sln

    - name: Build
      run: dotnet build Flawright.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/JerrettDavis.Flawright.UnitTests/JerrettDavis.Flawright.UnitTests.csproj --configuration Release --no-build --verbosity normal

  e2e-test:
    runs-on: windows-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore Flawright.sln

    - name: Build
      run: dotnet build Flawright.sln --configuration Release --no-restore

    - name: Run E2E Tests
      run: dotnet test tests/JerrettDavis.Flawright.E2ETests/JerrettDavis.Flawright.E2ETests.csproj --configuration Release --no-build --verbosity normal
      env:
        WINAPPDRIVER_URL: http://127.0.0.1:4723

  publish:
    runs-on: windows-latest
    needs: [build, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore Flawright.sln

    - name: Pack
      run: dotnet pack src/JerrettDavis.Flawright/JerrettDavis.Flawright.csproj --configuration Release --no-build -o ./artifacts

    - name: Publish to NuGet
      run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate