name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch to avoid redundant work
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  pr-checks:
    # Run on PRs and on pushes to any branch that is NOT main
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Flawright.slnx

      - name: Verify formatting
        run: >
          dotnet format Flawright.slnx
          --severity warn
          --verify-no-changes

      - name: Build (Release)
        run: >
          dotnet build Flawright.slnx
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true

      # Unit tests only — E2E tests run in the separate e2e-tests job below.
      # Targeting the UnitTests project directly keeps coverage collection clean
      # (E2E tests run real apps and have different coverage characteristics).
      - name: Test with coverage
        run: >
          dotnet test tests/Flawright.UnitTests/Flawright.UnitTests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/Flawright.UnitTests/coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" |
            Where-Object { $_.FullName -match "TestResults" } |
            Select-Object -First 1
          if (-not $report) {
            Write-Error "No coverage.cobertura.xml found under TestResults/"
            exit 1
          }
          $xml = [xml](Get-Content $report.FullName)
          $lineRate = [double]$xml.coverage.'line-rate'
          $linePercent = [math]::Round($lineRate * 100, 2)
          Write-Host "Line coverage: $linePercent%"
          # Gate raised to 92% to lock in coverage improvements from SelectOption/PackagedApp async tests
          # and ExcludeFromCodeCoverage annotations on trivial delegation classes.
          if ($linePercent -lt 92) {
            Write-Error "Coverage $linePercent% is below the minimum threshold of 92%"
            exit 1
          }
          Write-Host "Coverage gate passed: $linePercent% >= 92%"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./TestResults/**/*.trx

      - name: Install ReportGenerator
        run: dotnet tool update -g dotnet-reportgenerator-globaltool

      - name: Combine coverage reports
        shell: pwsh
        run: |
          $reports = (Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" |
            Where-Object { $_.FullName -match "TestResults" } |
            Select-Object -ExpandProperty FullName) -join ";"
          if (-not $reports) {
            Write-Warning "No coverage reports found — skipping ReportGenerator."
            exit 0
          }
          reportgenerator `
            "-reports:$reports" `
            "-targetdir:coverage-report" `
            "-reporttypes:HtmlInline;Cobertura;TextSummary;Badges" `
            "-assemblyfilters:+Flawright*;-*Tests*" `
            "-filefilters:-**/*.Tests/*;-**/*Tests*/**"
          $summary = Get-Content coverage-report/Summary.txt -Raw
          "COVERAGE_SUMMARY<<EOF`n$summary`nEOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: "**/TestResults/*/coverage.cobertura.xml"
          flags: unittests
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          recreate: true
          message: |
            ## Code Coverage
            ```
            ${{ env.COVERAGE_SUMMARY }}
            ```

  e2e-tests:
    name: E2E Tests (Windows)
    # Runs on every event the workflow fires for — PRs, branch pushes, and
    # pushes to main — so post-merge E2E coverage is visible. windows-2025-vs2026
    # runs as a real user (Session 1) and supports UIA + GUI apps.
    # VirtualInputMode means no focus-steal or cursor movement is needed —
    # the runner display quirks are irrelevant. No `needs:` dependency: this
    # job builds and runs independently of pr-checks/release so it works on
    # main pushes (where pr-checks is skipped) and provides parallel signal
    # when unit-test failures don't necessarily invalidate E2E results.
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore tests/Flawright.E2ETests/Flawright.E2ETests.csproj
          dotnet restore samples/Flawright.Reqnroll.NotepadDemo/Flawright.Reqnroll.NotepadDemo.csproj
          dotnet restore samples/Flawright.Reqnroll.CalculatorDemo/Flawright.Reqnroll.CalculatorDemo.csproj
          dotnet restore samples/Flawright.Reqnroll.SettingsDemo/Flawright.Reqnroll.SettingsDemo.csproj
          dotnet restore samples/Flawright.Reqnroll.ExplorerDemo/Flawright.Reqnroll.ExplorerDemo.csproj
          dotnet restore samples/Flawright.Reqnroll.QuickSettingsDemo/Flawright.Reqnroll.QuickSettingsDemo.csproj
          dotnet restore samples/Flawright.Reqnroll.NotepadMenuDemo/Flawright.Reqnroll.NotepadMenuDemo.csproj
          dotnet restore samples/Flawright.Reqnroll.PaintDrawDemo/Flawright.Reqnroll.PaintDrawDemo.csproj

      # Build the WPF test app explicitly so CI output makes it clear that the
      # deterministic test target was compiled successfully before the test run.
      # (The ProjectReference in Flawright.E2ETests.csproj also builds it, but
      # making it a named step means failures are immediately visible in the
      # GitHub Actions summary rather than buried inside "Build E2E".)
      - name: Build test app
        run: >
          dotnet build tests/Flawright.E2ETests.TestApp/Flawright.E2ETests.TestApp.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true

      - name: Build E2E
        run: >
          dotnet build tests/Flawright.E2ETests/Flawright.E2ETests.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true

      # System-app tests (SystemNotepadTests, SystemCalculatorTests) are opt-in:
      # they emit a visible skip reason when the required app is not installed.
      # No winget step needed — if the app is absent the test skips, not fails.
      - name: Run E2E tests
        run: >
          dotnet test tests/Flawright.E2ETests/Flawright.E2ETests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=e2e-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 12

      # ── Reqnroll BDD sample tests ─────────────────────────────────────────────
      # These samples exercise the Flawright.Reqnroll companion package end-to-end.
      # Each sample has a prerequisite hook that skips scenarios when the required
      # system app (Notepad, Calculator) is not installed on the runner.
      # NotepadDemo: Notepad is available on windows-latest — scenarios run.
      # CalculatorDemo: Calculator UWP is absent on windows-latest — scenarios skip.
      - name: Build Reqnroll NotepadDemo
        run: >
          dotnet build samples/Flawright.Reqnroll.NotepadDemo/Flawright.Reqnroll.NotepadDemo.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
        continue-on-error: true

      - name: Run Reqnroll NotepadDemo
        run: >
          dotnet test samples/Flawright.Reqnroll.NotepadDemo/Flawright.Reqnroll.NotepadDemo.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=notepad-bdd-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 5
        continue-on-error: true

      - name: Build Reqnroll CalculatorDemo
        run: >
          dotnet build samples/Flawright.Reqnroll.CalculatorDemo/Flawright.Reqnroll.CalculatorDemo.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
        continue-on-error: true

      - name: Run Reqnroll CalculatorDemo
        run: >
          dotnet test samples/Flawright.Reqnroll.CalculatorDemo/Flawright.Reqnroll.CalculatorDemo.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=calculator-bdd-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 5
        continue-on-error: true

      # ── SettingsDemo ───────────────────────────────────────────────────────────
      # Settings (windows.immersivecontrolpanel) is absent on Windows Server 2025 CI
      # runners. All SettingsDemo scenarios are expected to skip on CI.
      - name: Build Reqnroll SettingsDemo
        run: >
          dotnet build samples/Flawright.Reqnroll.SettingsDemo/Flawright.Reqnroll.SettingsDemo.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
        continue-on-error: true

      - name: Run Reqnroll SettingsDemo
        run: >
          dotnet test samples/Flawright.Reqnroll.SettingsDemo/Flawright.Reqnroll.SettingsDemo.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=settings-bdd-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 5
        continue-on-error: true

      # ── ExplorerDemo ───────────────────────────────────────────────────────────
      # explorer.exe exists on windows-2025-vs2026 but the shell process may not be
      # running in the CI session. ExplorerPrerequisites checks both. Scenarios that
      # can attach to a running explorer shell will run; others will skip gracefully.
      - name: Build Reqnroll ExplorerDemo
        run: >
          dotnet build samples/Flawright.Reqnroll.ExplorerDemo/Flawright.Reqnroll.ExplorerDemo.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
        continue-on-error: true

      - name: Run Reqnroll ExplorerDemo
        run: >
          dotnet test samples/Flawright.Reqnroll.ExplorerDemo/Flawright.Reqnroll.ExplorerDemo.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=explorer-bdd-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 5
        continue-on-error: true

      # ── QuickSettingsDemo ──────────────────────────────────────────────────────
      # ShellExperienceHost.exe is absent on Windows Server 2025 CI runners.
      # All QuickSettingsDemo scenarios are expected to skip on CI. This is by design
      # — Quick Settings requires the full Windows 11 interactive shell.
      - name: Build Reqnroll QuickSettingsDemo
        run: >
          dotnet build samples/Flawright.Reqnroll.QuickSettingsDemo/Flawright.Reqnroll.QuickSettingsDemo.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
        continue-on-error: true

      - name: Run Reqnroll QuickSettingsDemo
        run: >
          dotnet test samples/Flawright.Reqnroll.QuickSettingsDemo/Flawright.Reqnroll.QuickSettingsDemo.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=quicksettings-bdd-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 5
        continue-on-error: true

      # ── NotepadMenuDemo ────────────────────────────────────────────────────────
      # Notepad is available on windows-2025-vs2026 CI runners (WinUI3 packaged app).
      # NotepadMenuDemo: scenarios run when Notepad is present; skip when absent.
      - name: Build Reqnroll NotepadMenuDemo
        run: >
          dotnet build samples/Flawright.Reqnroll.NotepadMenuDemo/Flawright.Reqnroll.NotepadMenuDemo.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
        continue-on-error: true

      - name: Run Reqnroll NotepadMenuDemo
        run: >
          dotnet test samples/Flawright.Reqnroll.NotepadMenuDemo/Flawright.Reqnroll.NotepadMenuDemo.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=notepadmenu-bdd-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 5
        continue-on-error: true

      # ── PaintDrawDemo ──────────────────────────────────────────────────────────
      # MS Paint (Microsoft.Paint_8wekyb3d8bbwe) is absent on Windows Server 2025 CI
      # runners. All PaintDrawDemo scenarios are expected to skip on CI. This is by
      # design — Paint requires the full Windows 11 interactive shell and MSIX package.
      - name: Build Reqnroll PaintDrawDemo
        run: >
          dotnet build samples/Flawright.Reqnroll.PaintDrawDemo/Flawright.Reqnroll.PaintDrawDemo.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
        continue-on-error: true

      - name: Run Reqnroll PaintDrawDemo
        run: >
          dotnet test samples/Flawright.Reqnroll.PaintDrawDemo/Flawright.Reqnroll.PaintDrawDemo.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=paintdraw-bdd-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: ./TestResults/**/*.trx
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-
            nuget-${{ runner.os }}-

      - name: Determine version (NBGV)
        id: nbgv
        uses: dotnet/nbgv@305c840d64f86cec5a7727df1c19b3282d468220  # v0.4.x — pinned for supply-chain integrity
        with:
          setAllVars: true

      - name: Restore
        run: dotnet restore Flawright.slnx

      - name: Build (Release)
        run: >
          dotnet build Flawright.slnx
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true

      # Unit tests only — E2E tests run in the separate e2e-tests job.
      # Targeting the UnitTests project directly keeps coverage collection clean.
      - name: Test (Release)
        run: >
          dotnet test tests/Flawright.UnitTests/Flawright.UnitTests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/Flawright.UnitTests/coverlet.runsettings
          --results-directory ./TestResults

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" |
            Where-Object { $_.FullName -match "TestResults" } |
            Select-Object -First 1
          if (-not $report) {
            Write-Error "No coverage.cobertura.xml found under TestResults/"
            exit 1
          }
          $xml = [xml](Get-Content $report.FullName)
          $lineRate = [double]$xml.coverage.'line-rate'
          $linePercent = [math]::Round($lineRate * 100, 2)
          Write-Host "Line coverage: $linePercent%"
          # Gate raised to 92% to lock in coverage improvements from SelectOption/PackagedApp async tests
          # and ExcludeFromCodeCoverage annotations on trivial delegation classes.
          if ($linePercent -lt 92) {
            Write-Error "Coverage $linePercent% is below the minimum threshold of 92%"
            exit 1
          }
          Write-Host "Coverage gate passed: $linePercent% >= 92%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: "**/TestResults/*/coverage.cobertura.xml"
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Pack
        run: >
          dotnet pack Flawright.slnx
          --configuration Release
          --no-build
          --output ./artifacts
          /p:ContinuousIntegrationBuild=true

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ($env:NUGET_API_KEY) {
            Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
              dotnet nuget push $_.FullName `
                --api-key $env:NUGET_API_KEY `
                --source https://api.nuget.org/v3/index.json `
                --skip-duplicate
            }
          } else {
            Write-Host "Skipping NuGet.org push: NUGET_API_KEY secret not set."
          }

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key ${{ secrets.GITHUB_TOKEN }} `
              --source https://nuget.pkg.github.com/JerrettDavis/index.json `
              --skip-duplicate
          }

      - name: Create git tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$($env:NBGV_SemVer2)"
          $existing = git rev-parse $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists — skipping."
          } else {
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag $tag
            git push origin $tag
            Write-Host "Created and pushed tag $tag"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.NBGV_SemVer2 }}
          name: Release v${{ env.NBGV_NuGetPackageVersion }}
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          generate_release_notes: true
