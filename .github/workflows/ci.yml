name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to avoid redundant work
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  pr-checks:
    # Run on PRs and on pushes to any branch that is NOT main
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Flawright.slnx

      - name: Verify formatting
        run: >
          dotnet format Flawright.slnx
          --severity warn
          --verify-no-changes

      - name: Build (Release)
        run: >
          dotnet build Flawright.slnx
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true

      # Unit tests only — E2E tests run in the separate e2e-tests job below.
      # Targeting the UnitTests project directly keeps coverage collection clean
      # (E2E tests run real apps and have different coverage characteristics).
      - name: Test with coverage
        run: >
          dotnet test tests/Flawright.UnitTests/Flawright.UnitTests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/Flawright.UnitTests/coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" |
            Where-Object { $_.FullName -match "TestResults" } |
            Select-Object -First 1
          if (-not $report) {
            Write-Error "No coverage.cobertura.xml found under TestResults/"
            exit 1
          }
          $xml = [xml](Get-Content $report.FullName)
          $lineRate = [double]$xml.coverage.'line-rate'
          $linePercent = [math]::Round($lineRate * 100, 2)
          Write-Host "Line coverage: $linePercent%"
          if ($linePercent -lt 90) {
            Write-Error "Coverage $linePercent% is below the minimum threshold of 90%"
            exit 1
          }
          Write-Host "Coverage gate passed: $linePercent% >= 90%"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./TestResults/**/*.trx

      - name: Install ReportGenerator
        run: dotnet tool update -g dotnet-reportgenerator-globaltool

      - name: Combine coverage reports
        shell: pwsh
        run: |
          $reports = (Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" |
            Where-Object { $_.FullName -match "TestResults" } |
            Select-Object -ExpandProperty FullName) -join ";"
          if (-not $reports) {
            Write-Warning "No coverage reports found — skipping ReportGenerator."
            exit 0
          }
          reportgenerator `
            "-reports:$reports" `
            "-targetdir:coverage-report" `
            "-reporttypes:HtmlInline;Cobertura;TextSummary;Badges" `
            "-assemblyfilters:+Flawright*;-*Tests*" `
            "-filefilters:-**/*.Tests/*;-**/*Tests*/**"
          $summary = Get-Content coverage-report/Summary.txt -Raw
          "COVERAGE_SUMMARY<<EOF`n$summary`nEOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: "**/TestResults/*/coverage.cobertura.xml"
          flags: unittests
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          message: |
            ## Code Coverage
            ```
            ${{ env.COVERAGE_SUMMARY }}
            ```

  e2e-tests:
    name: E2E Tests (Windows)
    # Runs on every event the workflow fires for — PRs, branch pushes, and
    # pushes to main — so post-merge E2E coverage is visible. windows-latest
    # runs as a real user (Session 1) and supports UIA + GUI apps.
    # VirtualInputMode means no focus-steal or cursor movement is needed —
    # the runner display quirks are irrelevant. No `needs:` dependency: this
    # job builds and runs independently of pr-checks/release so it works on
    # main pushes (where pr-checks is skipped) and provides parallel signal
    # when unit-test failures don't necessarily invalidate E2E results.
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Flawright.E2ETests/Flawright.E2ETests.csproj

      - name: Build E2E
        run: >
          dotnet build tests/Flawright.E2ETests/Flawright.E2ETests.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true

      - name: Install UWP Calculator (windows-latest does not ship it)
        shell: pwsh
        run: |
          Write-Host "Installing Microsoft.WindowsCalculator via winget..."
          winget install --id Microsoft.WindowsCalculator --silent `
            --accept-source-agreements --accept-package-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            Write-Error "winget install failed with exit code $LASTEXITCODE"
            exit 1
          }
          # Verify the install registered. AUMID resolver looks in HKCU; if that's
          # empty after install, the package may need explicit user-context registration.
          $pkg = Get-AppxPackage Microsoft.WindowsCalculator
          if (-not $pkg) {
            Write-Error "Microsoft.WindowsCalculator did not register for the current user after winget install."
            exit 1
          }
          Write-Host "Installed: $($pkg.PackageFullName) at $($pkg.InstallLocation)"

      - name: Run E2E tests
        run: >
          dotnet test tests/Flawright.E2ETests/Flawright.E2ETests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=e2e-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults
        timeout-minutes: 12

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: ./TestResults/**/*.trx
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}-
            nuget-${{ runner.os }}-

      - name: Determine version (NBGV)
        id: nbgv
        uses: dotnet/nbgv@b944774b6878ef950cc14d1a72bf9c0ffafbb839  # v0.4.x — pinned for supply-chain integrity
        with:
          setAllVars: true

      - name: Restore
        run: dotnet restore Flawright.slnx

      - name: Build (Release)
        run: >
          dotnet build Flawright.slnx
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true

      # Unit tests only — E2E tests run in the separate e2e-tests job.
      # Targeting the UnitTests project directly keeps coverage collection clean.
      - name: Test (Release)
        run: >
          dotnet test tests/Flawright.UnitTests/Flawright.UnitTests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/Flawright.UnitTests/coverlet.runsettings
          --results-directory ./TestResults

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" |
            Where-Object { $_.FullName -match "TestResults" } |
            Select-Object -First 1
          if (-not $report) {
            Write-Error "No coverage.cobertura.xml found under TestResults/"
            exit 1
          }
          $xml = [xml](Get-Content $report.FullName)
          $lineRate = [double]$xml.coverage.'line-rate'
          $linePercent = [math]::Round($lineRate * 100, 2)
          Write-Host "Line coverage: $linePercent%"
          if ($linePercent -lt 90) {
            Write-Error "Coverage $linePercent% is below the minimum threshold of 90%"
            exit 1
          }
          Write-Host "Coverage gate passed: $linePercent% >= 90%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: "**/TestResults/*/coverage.cobertura.xml"
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Pack
        run: >
          dotnet pack Flawright.slnx
          --configuration Release
          --no-build
          --output ./artifacts
          /p:ContinuousIntegrationBuild=true

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ($env:NUGET_API_KEY) {
            Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
              dotnet nuget push $_.FullName `
                --api-key $env:NUGET_API_KEY `
                --source https://api.nuget.org/v3/index.json `
                --skip-duplicate
            }
          } else {
            Write-Host "Skipping NuGet.org push: NUGET_API_KEY secret not set."
          }

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          Get-ChildItem ./artifacts/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key ${{ secrets.GITHUB_TOKEN }} `
              --source https://nuget.pkg.github.com/JerrettDavis/index.json `
              --skip-duplicate
          }

      - name: Create git tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$($env:NBGV_SemVer2)"
          $existing = git rev-parse $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists — skipping."
          } else {
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag $tag
            git push origin $tag
            Write-Host "Created and pushed tag $tag"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.NBGV_SemVer2 }}
          name: Release v${{ env.NBGV_NuGetPackageVersion }}
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          generate_release_notes: true
