name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: Package Version
      description: Which version of Flawright are you using?
      placeholder: "0.3.0-preview.42"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Windows Version
      description: Which version of Windows are you running?
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal code or steps to reproduce the issue. Include your selector string and the target application if relevant (e.g., Notepad on Win11 vs Win10).
      render: csharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include stack traces and the selector that didn't match if applicable.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: IDE, target application, UIA tree details (from Accessibility Insights or FlaUI Inspect), or other relevant details.
    validations:
      required: false
